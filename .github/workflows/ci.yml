name: CI

on:
  push:
    branches: [ main, master, frontend ]
  pull_request:
    branches: [ main, master, frontend ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --silent || npm install --silent

    - name: Typecheck
      run: npm run typecheck

    - name: Build
      run: npm run build