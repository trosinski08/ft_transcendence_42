name: CI

on:
  push:
    branches: [ main, master, frontend ]
  pull_request:
    branches: [ main, master, frontend ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --silent || npm install --silent

    - name: Typecheck
      run: npm run typecheck

    - name: Build
      run: npm run build

    - name: CSP header check
      run: |
        docker run --rm -d --name csp-test -p 9443:443 \
          -v "$PWD/dist":/usr/share/nginx/html:ro \
          -v "$PWD/nginx/nginx.conf":/etc/nginx/conf.d/default.conf:ro \
          -v "$PWD/nginx/ssl":/etc/nginx/ssl:ro \
          nginx:1.27-alpine
        for i in {1..20}; do curl -ksI https://localhost:9443/ && break || sleep 1; done
        curl -ksI https://localhost:9443/ | tee headers.txt
        grep -i "^Content-Security-Policy: .*style-src 'self'" headers.txt
        docker rm -f csp-test