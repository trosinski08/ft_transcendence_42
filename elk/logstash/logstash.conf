input {
  # Frontend logs via HTTP
  http {
    port => 8080
    codec => json
    tags => ["frontend"]
    type => "frontend"
  }

  # Backend logs via HTTP
  http {
    port => 8081
    codec => json
    tags => ["backend"]
    type => "backend"
  }

  # Nginx access/error logs via HTTP
  http {
    port => 8082
    codec => json
    tags => ["nginx"]
    type => "nginx"
  }

  # Database logs via HTTP
  http {
    port => 8083
    codec => json
    tags => ["database"]
    type => "database"
  }

  # Beats input (optional - for filebeat/metricbeat)
  beats {
    port => 5000
    tags => ["beats"]
  }
}

filter {
  # Add environment metadata
  mutate {
    add_field => {
      "environment" => "development"
      "application" => "ft_transcendence_pong"
    }
  }

  # Parse timestamp if present
  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
    }
  }

  # Frontend-specific processing
  if "frontend" in [tags] {
    mutate {
      add_field => { "log_source" => "frontend" }
    }
    
    # Extract user session info if available
    if [sessionId] {
      mutate {
        add_field => { "session_id" => "%{sessionId}" }
      }
    }

    # Categorize frontend events
    if [eventType] {
      mutate {
        add_field => { "event_category" => "%{eventType}" }
      }
    }
  }

  # Backend-specific processing
  if "backend" in [tags] {
    mutate {
      add_field => { "log_source" => "backend" }
    }

    # Extract HTTP request info
    if [method] and [path] {
      mutate {
        add_field => { 
          "http_method" => "%{method}"
          "http_path" => "%{path}"
        }
      }
    }

    # Extract status code
    if [statusCode] {
      mutate {
        add_field => { "http_status" => "%{statusCode}" }
      }
    }

    # Extract response time for performance monitoring
    if [responseTime] {
      mutate {
        convert => { "responseTime" => "integer" }
      }
    }
  }

  # Nginx-specific processing
  if "nginx" in [tags] {
    mutate {
      add_field => { "log_source" => "nginx" }
    }

    # Parse nginx access log format
    if [log_type] == "access" {
      grok {
        match => { 
          "message" => "%{IPORHOST:client_ip} - %{DATA:user} \[%{HTTPDATE:timestamp}\] \"%{WORD:method} %{DATA:path} HTTP/%{NUMBER:http_version}\" %{NUMBER:status_code} %{NUMBER:bytes_sent} \"%{DATA:referrer}\" \"%{DATA:user_agent}\""
        }
      }
    }
  }

  # Database-specific processing
  if "database" in [tags] {
    mutate {
      add_field => { "log_source" => "database" }
    }

    # Extract query info for slow query logs
    if [queryTime] {
      mutate {
        convert => { "queryTime" => "float" }
      }
    }
  }

  # Error severity classification
  if [level] {
    translate {
      field => "level"
      destination => "severity"
      dictionary => {
        "ERROR" => "high"
        "WARN" => "medium"
        "INFO" => "low"
        "DEBUG" => "low"
      }
      fallback => "unknown"
    }
  }

  # GeoIP enrichment for client IPs (optional)
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geoip"
    }
  }
}

output {
  # Route to source-specific indices
  if "frontend" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "pong-frontend-%{+YYYY.MM.dd}"
    }
  }

  if "backend" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "pong-backend-%{+YYYY.MM.dd}"
    }
  }

  if "nginx" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "pong-nginx-%{+YYYY.MM.dd}"
    }
  }

  if "database" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "pong-database-%{+YYYY.MM.dd}"
    }
  }

  # Fallback for untagged logs
  if "frontend" not in [tags] and "backend" not in [tags] and "nginx" not in [tags] and "database" not in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "pong-misc-%{+YYYY.MM.dd}"
    }
  }

  # Debug output to stdout (optional - remove in production)
  stdout {
    codec => rubydebug
  }
}
