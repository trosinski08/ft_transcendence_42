services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: pong-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - elk-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.0
    container_name: pong-logstash
    volumes:
      - ./logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./logstash/patterns:/usr/share/logstash/patterns:ro
    ports:
      - "5000:5000/tcp"
      - "5000:5000/udp"
      - "8080:8080"  # Frontend logs HTTP input
      - "8081:8081"  # Backend logs HTTP input
      - "8082:8082"  # Nginx logs HTTP input
      - "8083:8083"  # Database logs HTTP input
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    networks:
      - elk-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9600/_node/stats || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: pong-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=min-32-byte-long-strong-encryption-key
    networks:
      - elk-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  kibana-setup:
    image: curlimages/curl:8.10.1
    container_name: pong-kibana-setup
    depends_on:
      kibana:
        condition: service_healthy
    networks:
      - elk-network
    command: >
      sh -c '
        echo "Waiting for Kibana to be ready..." &&
        sleep 20 &&
        echo "Creating data views in Kibana..." &&

        # Frontend data view
        curl -X POST "http://kibana:5601/api/data_views/data_view" -H "kbn-xsrf: true" -H "Content-Type: application/json" -d "{\"data_view\": {\"title\": \"pong-frontend-*\", \"name\": \"pong-frontend\", \"timeFieldName\": \"@timestamp\"}}"

        # Backend data view
        curl -X POST "http://kibana:5601/api/data_views/data_view" -H "kbn-xsrf: true" -H "Content-Type: application/json" -d "{\"data_view\": {\"title\": \"pong-backend-*\", \"name\": \"pong-backend\", \"timeFieldName\": \"@timestamp\"}}"

        # Nginx data view
        curl -X POST "http://kibana:5601/api/data_views/data_view" -H "kbn-xsrf: true" -H "Content-Type: application/json" -d "{\"data_view\": {\"title\": \"pong-nginx-*\", \"name\": \"pong-nginx\", \"timeFieldName\": \"@timestamp\"}}"

        # Database data view
        curl -X POST "http://kibana:5601/api/data_views/data_view" -H "kbn-xsrf: true" -H "Content-Type: application/json" -d "{\"data_view\": {\"title\": \"pong-database-*\", \"name\": \"pong-database\", \"timeFieldName\": \"@timestamp\"}}"

        echo "✅ Data views created successfully!"
      '

volumes:
  elasticsearch-data:
    driver: local

networks:
  elk-network:
    driver: bridge
