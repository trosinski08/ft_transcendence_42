services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frontend
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - appnet
    tty: true

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend # Zakładamy, że stworzymy ten plik
    container_name: backend
    volumes:
      - db_data:/app/data # Wolumen do przechowywania bazy danych SQLite
    environment:
      - DATABASE_PATH=/app/data/database.sqlite
    networks:
      - appnet
    tty: true

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8080:8080"
      - "9443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl/server.crt:/etc/nginx/ssl/server.crt
      - ./nginx/ssl/server.key:/etc/nginx/ssl/server.key
    depends_on:
      - frontend
      - backend
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.30.0.0/16

volumes:
  db_data:
