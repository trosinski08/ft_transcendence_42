services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    volumes:
      - db_data:/app/prisma # Wolumen do przechowywania pliku bazy danych SQLite (backend/prisma/dev.db)
    environment:
      - DATABASE_URL=file:./prisma/dev.db
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - appnet
    tty: true

  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    container_name: nginx
    ports:
      - "8080:80"
      - "9443:443"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
    # ipam:
    #   driver: default
    #   config:
    #     - subnet: 172.30.0.0/16

volumes:
  db_data:
